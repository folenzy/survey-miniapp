<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Анкета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f2f4f3);
  --card:var(--tg-theme-bg-color,#fff);
  --text:var(--tg-theme-text-color,#1f2421);
  --hint:var(--tg-theme-hint-color,#7a817d);
  --accent:var(--tg-theme-button-color,#2f8f5b);
  --accent-text:var(--tg-theme-button-text-color,#fff);
  --line:color-mix(in srgb,var(--hint) 30%,transparent);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:auto;padding:12px 12px 96px}
header{padding:8px 4px 4px}
h1{font-size:21px;margin:0 0 4px;line-height:1.25}
.sub{color:var(--hint);font-size:14px;margin:0}
.progress{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 4px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.ptext{font-size:13px;color:var(--hint);margin-top:6px}
.q{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}
.q h3{font-size:16px;margin:0 0 4px;line-height:1.35}
.num{color:var(--accent);margin-right:4px}
.hint{font-size:13px;color:var(--hint);margin:0 0 6px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px;min-height:48px;
  border:1.5px solid var(--line);border-radius:12px;background:transparent;color:inherit;font:inherit;font-size:15px;cursor:pointer;transition:border-color .15s,background .15s}
.opt .mark{flex:none;width:20px;height:20px;margin-top:1px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center}
.multi .opt .mark{border-radius:6px}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.opt.on .mark{border-color:var(--accent);background:var(--accent)}
.opt.on .mark::after{content:"";width:6px;height:10px;border:solid var(--accent-text);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt:disabled{opacity:.45;cursor:default}
.done{font-size:13px;color:var(--accent);font-weight:600;min-height:18px}
#send{display:none;position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:696px;margin:auto;
  padding:15px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:600 16px system-ui;cursor:pointer}
#send:disabled{opacity:.5}
.thanks{text-align:center;padding:60px 20px}
@media (min-width:700px){h1{font-size:26px}.q{padding:22px}.q h3{font-size:18px}.opt{font-size:16px}}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--accent)}}
</style></head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>Влияние интерьера стоматологического кабинета на тревожность</h1>
    <p class="sub">Анонимная анкета · 7 вопросов · около минуты</p>
  </header>
  <div class="progress"><div class="bar"><i id="bar"></i></div><div class="ptext" id="ptext"></div></div>
  <div id="qs"></div>
</div>
<button id="send">Отправить ответы</button>
<script>
const QUESTIONS = [
  {t:"Испытываете ли вы чувство тревоги или страха перед визитом к стоматологу?",
   o:["Да, сильный страх","Да, лёгкое беспокойство","Нет, чувствую себя спокойно"]},
  {t:"Что является главным источником вашей тревоги в стоматологическом кабинете?", max:2,
   o:["Боль и сам процесс лечения","Звук работающей бормашины и вид инструментов","Вид врача в белом халате («эффект ятрофобии»)","Ощущение беспомощности и скованности в кресле","Холодная, стерильно-больничная атмосфера и запахи"]},
  {t:"Как на ваше эмоциональное состояние влияет традиционный интерьер кабинета (белые стены, кафель, яркие слепящие светильники)?",
   o:["Усиливает тревогу, ощущение «операционной»","Нейтрально, я не обращаю внимания","Вызывает чувство безопасности и стерильной чистоты"]},
  {t:"Какие цветовые решения в интерьере зоны ожидания и кабинета успокаивают вас больше всего?",
   o:["Пастельные природные оттенки (мягкий зелёный, нежный беж, светло-голубой)","Тёплые акценты (приглушённый персиковый, мягкий жёлтый)","Классический белый / стерильный стиль"]},
  {t:"Какое освещение для вас предпочтительнее во время ожидания приёма?",
   o:["Мягкий рассеянный тёплый свет с матовыми плафонами","Яркое, максимально светлое помещение","Не имеет значения"]},
  {t:"Отвлекают ли вас посторонние звуки (шум из коридора, звуки оборудования из соседних кабинетов) во время нахождения в клинике?",
   o:["Да, они сильно раздражают и усиливают панику","Замечаю, но они не мешают","Нет, не обращаю внимания"]},
  {t:"Помогла бы вам снизить стресс тихая фоновая музыка или звуки природы в кабинете / зоне ожидания?",
   o:["Да, это очень помогает отвлечься","Скорее нет, мне лучше в тишине","Всё равно"]}
];
const LETTERS = "АБВГД";
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
const picked = QUESTIONS.map(() => []);
const sendBtn = document.getElementById("send");

if (tg) { tg.ready(); tg.expand(); }

function render() {
  const box = document.getElementById("qs");
  QUESTIONS.forEach((q, i) => {
    const card = document.createElement("section");
    card.className = "q" + (q.max ? " multi" : "");
    card.innerHTML = `<h3><span class="num">${i + 1}.</span>${q.t}</h3>` +
      (q.max ? `<p class="hint">Выберите не более ${q.max} вариантов</p>` : "");
    const btns = q.o.map((txt, j) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<span class="mark"></span><span>${LETTERS[j]}) ${txt}</span>`;
      b.onclick = () => toggle(i, j);
      card.appendChild(b);
      return b;
    });
    const done = document.createElement("div");
    done.className = "done";
    card.appendChild(done);
    q.ui = { btns, done };
    box.appendChild(card);
  });
  update();
}

function toggle(i, j) {
  const q = QUESTIONS[i], sel = picked[i];
  if (!q.max) picked[i] = [j];
  else if (sel.includes(j)) sel.splice(sel.indexOf(j), 1);
  else if (sel.length < q.max) sel.push(j);
  if (tg) tg.HapticFeedback.selectionChanged();
  update();
}

function update() {
  QUESTIONS.forEach((q, i) => {
    const sel = picked[i];
    q.ui.btns.forEach((b, j) => {
      b.classList.toggle("on", sel.includes(j));
      b.disabled = !!q.max && sel.length >= q.max && !sel.includes(j);
    });
    q.ui.done.textContent = sel.length ? "✓ Вы ответили" : "";
  });
  const answered = picked.filter(s => s.length).length;
  const all = answered === QUESTIONS.length;
  document.getElementById("bar").style.width = answered / QUESTIONS.length * 100 + "%";
  document.getElementById("ptext").textContent = all ? "Все вопросы отвечены" : `Отвечено ${answered} из ${QUESTIONS.length}`;
  if (tg) {
    tg.MainButton.setText(all ? "Отправить ответы" : `Ответьте на все вопросы (${answered}/${QUESTIONS.length})`);
    tg.MainButton.show();
    all ? tg.MainButton.enable() : tg.MainButton.disable();
  } else {
    sendBtn.style.display = "block";
    sendBtn.disabled = !all;
  }
}

// Ответы уходят текстом, а не индексами, чтобы бот не зависел от порядка вариантов
function payload() {
  return JSON.stringify({ v: 1, a: picked.map((sel, i) => sel.map(j => QUESTIONS[i].o[j])) });
}

function submit() {
  if (picked.some(s => !s.length)) return;
  if (tg) { tg.sendData(payload()); return; } // sendData сам закрывает Mini App
  document.getElementById("app").innerHTML =
    `<div class="thanks"><h1>Спасибо!</h1><p class="sub">Страница открыта вне Telegram, поэтому ответы никуда не отправлены.</p><pre style="white-space:pre-wrap;text-align:left;font-size:12px">${payload()}</pre></div>`;
  sendBtn.style.display = "none";
}

if (tg) tg.MainButton.onClick(submit);
sendBtn.onclick = submit;
render();
</script>
</body></html>
